ingestion_protocol:
  encoding_policy: "deterministic_cascade"
  primary_encoding: "utf-8"
  fallback_encoding: "windows-1252"
  candidate_encodings:
    - "utf-8"
    - "windows-1252"
  silent_decode_error_allowed: false
  policy_rationale: >
    Strict UTF-8 is attempted first. On UnicodeDecodeError, fallback to Windows-1252 is performed.
    Latin-1 is strictly prohibited as a leading decoder because it decodes all 256 bytes without error,
    which silently masks encoding corruption and mojibake. Silent error discarding (errors='ignore') is prohibited.

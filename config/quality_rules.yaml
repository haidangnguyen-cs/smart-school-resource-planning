# Smart School Resource Planning - Data Quality and Validation Rules
# Quality Rules Data Contract

identifier_rules:
  school_id:
    source_field: "NCESSCH"
    format: "string"
    length: 12
    pattern: "^[0-9]{12}$"
    nullable: false
    preserve_leading_zeros: true
    description: "Must be 12-digit zero-padded string; never coerced to numeric"

  district_id:
    source_field: "LEAID"
    format: "string"
    length: 7
    pattern: "^[0-9]{7}$"
    nullable: false
    preserve_leading_zeros: true
    description: "Must be 7-digit zero-padded string"

  state_fips:
    source_field: "FIPST"
    format: "string"
    length: 2
    pattern: "^[0-9]{2}$"
    nullable: false
    preserve_leading_zeros: true
    description: "Must be 2-digit zero-padded string"

  school_year:
    source_field: "SCHOOL_YEAR"
    format: "string"
    length: 7
    pattern: "^[0-9]{4}-[0-9]{2}$"
    raw_format: "YYYY-YYYY"
    canonical_format: "YYYY-YY"
    transformation: "f'{val[:4]}-{val[-2:]}'"
    nullable: false
    description: "Must be standardized 7-character string (e.g. '2018-19'); transformed from raw 9-character 'YYYY-YYYY'"

table_grain_rules:
  directory:
    grain: ["school_id", "school_year"]
    duplicate_policy: "fail"
    expected_rows_range: [100000, 105000]

  staff:
    grain: ["school_id", "school_year"]
    duplicate_policy: "fail"
    expected_rows_range: [98000, 102000]
    required_indicator: "Education Unit Total"

  membership:
    raw_grain: ["school_id", "school_year", "grade", "race_ethnicity", "sex", "total_indicator"]
    filtered_grain: ["school_id", "school_year"]
    duplicate_policy: "fail"
    disaggregation_filter_required: true
    primary_panel_indicator: "Derived - Education Unit Total minus Adult Education Count"
    grain_isolation_rule: >
      To enforce strict 1:1 school-year grain, the primary analytical panel MUST admit only
      'Derived - Education Unit Total minus Adult Education Count'. Admitting multiple indicators
      into the primary panel would produce duplicate school-year records. If 'Education Unit Total'
      is retained, it must be loaded as an auxiliary audit column, never an additional row.

missing_and_special_code_rules:
  teacher_fte:
    measure_field: "TEACHERS"
    flag_field: "DMS_FLAG"
    valid_flag_values:
      reported: "Reported"
      missing: "Missing"
      not_reported: "Not reported"
      suppressed: "Suppressed"
    handling:
      when_reported: "Must parse as numeric float >= 0.0"
      when_non_reported: "Must parse as null (NaN); NEVER coerce to zero"
      when_zero_reported: "Valid reported zero FTE; flag as zero_teacher_anomaly for audit"

  student_enrollment:
    measure_field: "STUDENT_COUNT"
    flag_field: "DMS_FLAG"
    handling:
      numeric_string: "Parse as non-negative integer >= 0"
      empty_string: "Parse as null (NaN); preserve missingness code in flag"
      zero_count: "Valid reported zero enrollment; cross-reference with school_status"

join_rules:
  spine_table: "directory"
  joins:
    - table: "staff"
      join_key: ["school_id", "school_year"]
      type: "left"
      expected_match_rate_min: 0.96
      cardinality: "one_to_zero_or_one"
      target_key_unique: true
      unmatched_spine_permitted: true
    - table: "membership"
      join_key: ["school_id", "school_year"]
      type: "left"
      expected_match_rate_min: 0.96
      cardinality: "one_to_zero_or_one"
      target_key_unique: true
      unmatched_spine_permitted: true
  post_join_invariants:
    grain: ["school_id", "school_year"]
    cardinality: "one_to_zero_or_one"
    unique_key_enforcement: true
    duplicate_key_policy: "fail"
    unmatched_keys_handling: >
      Directory serves as the spine table. Each source key must be unique in target tables to guarantee
      at most one match (strictly zero row multiplication). Because not every directory school has a
      corresponding Staff or Membership record (~2-4% unmatched), unmatched spine records are fully
      permitted, retained with null measure values, and recorded in data quality audit logs.

scoping_rules:
  status_field: "SY_STATUS_TEXT"
  updated_status_field: "UPDATED_STATUS_TEXT"
  code_vs_text_distinction: "UPDATED_STATUS is a numeric integer code; SY_STATUS_TEXT and UPDATED_STATUS_TEXT are text categories"
  active_school_status:
    candidate_active_statuses: ["Open", "New"]
    candidate_inactive_statuses: ["Closed", "Inactive", "Future"]
    transition_review_statuses: ["Added", "Changed Boundary/Agency", "Reopened"]
    evaluation_policy: >
      Operational status filter is applied as an analytical cohort flag rather than silently dropping
      records at ingestion. Ambiguous transition categories ('Added', 'Changed Boundary/Agency', 'Reopened')
      must not automatically be classified as inactive; they are preserved in an explicit review bucket
      for empirical evaluation during ingestion and panel reconciliation against reported enrollment and staffing.
